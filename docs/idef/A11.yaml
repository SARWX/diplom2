# IDEF0 — Декомпозиция A1 «Инициализация системы»
# ICOM = стрелки блока a1 из A1.yaml:
#   Input:    «Питание и аппаратная конфигурация»
#   Output:   «Инициализированная аппаратная среда»
#   Control:  «Роль устройства»
#   Mechanism: «STM32F103C8», «DW1000 UWB трансивер»

diagram:
  name: "Инициализация системы — A11"
  node: "A11"
  parent: "A1"
  title: "Декомпозиция: инициализация аппаратуры и сети"

activities:

  - id: a1
    name: "Инициализация\nпериферии MCU"

  - id: a2
    name: "Инициализация\nDW1000"

  - id: a3
    name: "Определение роли\nустройства"

  - id: a4
    name: "Инициализация\nMAC-уровня"

arrows:

  # ── Inputs ────────────────────────────────────────────────────────────────

  - label: "Питание и аппаратная\nконфигурация"
    from: ext.left
    to: a1.left

  # ── Outputs ───────────────────────────────────────────────────────────────

  - label: "Инициализированная\nаппаратная среда"
    from: a4.right
    to: ext.right

  # ── Controls ──────────────────────────────────────────────────────────────

  - label: "Роль устройства\n(MAIN_ANCHOR / ANCHOR / TAG)"
    from: ext.top
    to: a3.top

  # ── Mechanisms ────────────────────────────────────────────────────────────

  - label: "STM32F103C8\n(CPU, UART, SPI, GPIO)"
    from: ext.bottom
    to: [a1.bottom, a3.bottom, a4.bottom]

  - label: "DW1000 UWB трансивер"
    from: ext.bottom
    to: a2.bottom

  # ── Внутренние стрелки ────────────────────────────────────────────────────

  - label: "Конфигурация SPI,\nGPIO (сброс, IRQ, CS)"
    from: a1.right
    to: a2.left

  - label: "Part ID из OTP"
    from: a2.right
    to: a3.left

  - label: "EUI-64 и роль\nустройства (тип)"
    from: a3.right
    to: a4.left
