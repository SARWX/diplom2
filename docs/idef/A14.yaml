# IDEF0 — Декомпозиция A4 «Дальнометрия SS-TWR»
# ICOM = стрелки блока a4 из A1.yaml:
#   Input:    «Откалиброванные межанкерные дистанции»
#   Output:   «Данные дистанций (meas_table rows)»
#   Control:  «UWB протокол», «Параметры калибровки»
#   Mechanism: «DW1000 UWB трансивер», «MAC уровень», «SS-TWR стек»

diagram:
  name: "Дальнометрия SS-TWR — A14"
  node: "A14"
  parent: "A1"
  title: "Декомпозиция: непрерывная дальнометрия тега"

activities:

  - id: a1
    name: "Передача POLL-кадра\n(инициатор)"

  - id: a2
    name: "Приём POLL и\nформирование ответа\n(ответчик, ISR)"

  - id: a3
    name: "Извлечение меток\nвремени и вычисление\nсырой дистанции"

  - id: a4
    name: "Коррекция:\nчастотная и\nтемпературная"

arrows:

  # ── Inputs ────────────────────────────────────────────────────────────────

  - label: "Откалиброванные\nмежанкерные дистанции\n(список якорей)"
    from: ext.left
    to: a1.left

  # ── Outputs ───────────────────────────────────────────────────────────────

  - label: "Данные дистанций\n(meas_table rows)"
    from: a4.right
    to: ext.right

  # ── Controls ──────────────────────────────────────────────────────────────

  - label: "UWB протокол\n(IEEE 802.15.4 + SS-TWR)"
    from: ext.top
    to: [a1.top, a2.top]

  - label: "Параметры калибровки\n(SET_ANT_DLY / SET_TEMP_COEF)"
    from: ext.top
    to: [a1.top, a2.top, a4.top]

  # ── Mechanisms ────────────────────────────────────────────────────────────

  - label: "DW1000 UWB трансивер"
    from: ext.bottom
    to: [a1.bottom, a2.bottom, a3.bottom]

  - label: "MAC уровень\n(IEEE 802.15.4 стек)"
    from: ext.bottom
    to: [a1.bottom, a2.bottom]

  - label: "SS-TWR стек"
    from: ext.bottom
    to: [a3.bottom, a4.bottom]

  # ── Внутренние стрелки ────────────────────────────────────────────────────

  - label: "POLL-кадр по эфиру\n(функц. код 0xE0)"
    from: a1.right
    to: a2.left

  - label: "RESPONSE-кадр\n(poll_rx_ts, resp_tx_ts_est)"
    from: a2.right
    to: a3.left

  - label: "Метки времени TX\n(poll_tx_ts, resp_rx_ts)"
    from: a1.right
    to: a3.left

  - label: "Сырое расстояние (м)"
    from: a3.right
    to: a4.left
