# IDEF0 — Декомпозиция A4 «Дальнометрия SS-TWR»

diagram:
  name: "Дальнометрия SS-TWR — A14"
  node: "A14"
  parent: "A1"
  title: "Декомпозиция: непрерывная дальнометрия тега"

activities:

  - id: a1
    name: "Передача POLL-кадра\n(инициатор)"

  - id: a2
    name: "Приём и обработка\nPOLL (ответчик)"

  - id: a3
    name: "Передача RESPONSE-кадра\n(ответчик, delayed TX)"

  - id: a4
    name: "Извлечение меток времени\nи вычисление дистанции"

  - id: a5
    name: "Температурная и\nчастотная коррекция"

arrows:

  # ── Inputs ───────────────────────────────────────────────────────────────

  - label: "Откалиброванная сеть\n(список якорей)"
    from: ext.left
    to: a1.left

  - label: "POLL-кадр по эфиру\n(функц. код 0xE0)"
    from: a1.right
    to: a2.left

  - label: "RESPONSE-кадр\n(poll_rx_ts, resp_tx_ts_est)"
    from: a3.right
    to: a4.left

  - label: "Метки времени DW1000\n(poll_tx_ts, resp_rx_ts)"
    from: a1.right
    to: a4.left

  - label: "Сырое расстояние (м)"
    from: a4.right
    to: a5.left

  - label: "Скорректированные\nдистанции (meas_table rows)"
    from: a5.right
    to: ext.right

  # ── Controls ─────────────────────────────────────────────────────────────

  - label: "Антенные задержки\nTX_ANT_DLY / RX_ANT_DLY\n(SET_ANT_DLY)"
    from: ext.top
    to: [a1.top, a3.top]

  - label: "RESP_RX_TIMEOUT = 5000 мкс\nMAIN_TX_TIMEOUT = 10 мс"
    from: ext.top
    to: a1.top

  - label: "Температурный коэффициент K\n(SET_TEMP_COEF)\nT_ref = 23 °C"
    from: ext.top
    to: a5.top

  - label: "POLL_RX_TO_RESP_TX_DLY\n(задержка ответа, мкс)"
    from: ext.top
    to: a2.top

  # ── Mechanisms ───────────────────────────────────────────────────────────

  - label: "dwt_writetxdata()\ndwt_starttx(DWT_START_TX_IMMEDIATE\n| DWT_RESPONSE_EXPECTED)"
    from: ext.bottom
    to: a1.bottom

  - label: "ss_twr_isr()\n(RX прерывание DW1000)"
    from: ext.bottom
    to: a2.bottom

  - label: "dwt_setdelayedtrxtime()\ndwt_starttx(DWT_START_TX_DELAYED)"
    from: ext.bottom
    to: a3.bottom

  - label: "twr_calc_distance()\n(RTD формула + carrier integrator\nFREQ_OFFSET_MULTIPLIER)"
    from: ext.bottom
    to: a4.bottom

  - label: "ss_twr_read_temperature()\nss_twr_set_temp_coef()\nss_twr_set_ant_dly()"
    from: ext.bottom
    to: a5.bottom
