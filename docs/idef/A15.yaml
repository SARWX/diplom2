# IDEF0 — Декомпозиция A5 «Обработка команд и вывод данных»
# ICOM = стрелки блока a5 из A1.yaml:
#   Input:    «UART команды хоста», «Данные дистанций (meas_table rows)»
#   Output:   «Данные дистанций (бинарные пакеты meas_table)», «Статус системы»
#   Control:  «UART команды хоста»
#   Mechanism: «STM32F103C8», «UART драйвер»

diagram:
  name: "Обработка команд и вывод данных — A15"
  node: "A15"
  parent: "A1"
  title: "Декомпозиция: UART-интерфейс мастер-якоря"

activities:

  - id: a1
    name: "Приём и разбор\nUART-команды"

  - id: a2
    name: "Диспетчеризация\nи выполнение\nкоманды"

  - id: a3
    name: "Пересылка сетевых\nкоманд на узлы\n(форвардинг)"

  - id: a4
    name: "Приём потока\nдальнометрии\nот TAG"

  - id: a5
    name: "Формирование и\nотправка ответа\nхосту"

arrows:

  # ── Inputs ────────────────────────────────────────────────────────────────

  - label: "UART команды хоста"
    from: ext.left
    to: a1.left

  - label: "Данные дистанций\n(meas_table rows)"
    from: ext.left
    to: a4.left

  # ── Outputs ───────────────────────────────────────────────────────────────

  - label: "Данные дистанций\n(бинарные пакеты meas_table)"
    from: a5.right
    to: ext.right

  - label: "Статус системы\n(OK / ERR / device list)"
    from: a5.right
    to: ext.right

  # ── Controls ──────────────────────────────────────────────────────────────

  - label: "UART команды хоста"
    from: ext.top
    to: [a1.top, a2.top]

  # ── Mechanisms ────────────────────────────────────────────────────────────

  - label: "STM32F103C8\n(CPU, UART, SPI, GPIO)"
    from: ext.bottom
    to: [a1.bottom, a5.bottom]

  - label: "UART драйвер"
    from: ext.bottom
    to: [a1.bottom, a5.bottom]

  # ── Внутренние стрелки ────────────────────────────────────────────────────

  - label: "Распознанная команда\n(CMD + аргументы)"
    from: a1.right
    to: a2.left

  - label: "Параметры для узла\n(seq_id, tx_dly / rx_dly / k)"
    from: a2.right
    to: a3.left

  - label: "Результат выполнения\n(OK / ERR / данные)"
    from: a2.right
    to: a5.left

  - label: "Бинарные пакеты\ndistance для вывода"
    from: a4.right
    to: a5.left
