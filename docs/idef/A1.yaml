# IDEF0 — Уровень A1 (декомпозиция A-0)
# Внешние стрелки (ICOM) совпадают с A-0 один в один.

diagram:
  name: "UWB система позиционирования — A1"
  node: "A1"
  parent: "A-0"
  title: "Декомпозиция: основные функции"

activities:

  - id: a1
    name: "Инициализация\nсистемы"
    ref: A11.yaml

  - id: a2
    name: "Обнаружение\nустройств"
    ref: A12.yaml

  - id: a3
    name: "Конфигурирование\nсети"
    ref: A13.yaml

  - id: a4
    name: "Дальнометрия\nSS-TWR"
    ref: A14.yaml

  - id: a5
    name: "Обработка команд\nи вывод данных"
    ref: A15.yaml

arrows:

  # ── Inputs (= A-0) ───────────────────────────────────────────────────────

  - label: "Питание и аппаратная\nконфигурация"
    from: ext.left
    to: a1.left

  - label: "UART команды хоста"
    from: ext.left
    to: a5.left

  # ── Outputs (= A-0) ──────────────────────────────────────────────────────

  - label: "Данные дистанций\n(бинарные пакеты meas_table)"
    from: a5.right
    to: ext.right

  - label: "Статус системы\n(OK / ERR / device list)"
    from: a5.right
    to: ext.right

  # ── Controls (= A-0) ─────────────────────────────────────────────────────

  - label: "Роль устройства\n(MAIN_ANCHOR / ANCHOR / TAG)"
    from: ext.top
    to: a1.top

  - label: "UWB протокол\n(IEEE 802.15.4 + SS-TWR)"
    from: ext.top
    to: [a2.top, a3.top, a4.top]

  - label: "Параметры калибровки\n(SET_ANT_DLY / SET_TEMP_COEF)"
    from: ext.top
    to: a4.top

  - label: "UART команды хоста"
    from: ext.top
    to: a5.top

  # ── Mechanisms (= A-0) ───────────────────────────────────────────────────

  - label: "STM32F103C8\n(CPU, UART, SPI, GPIO)"
    from: ext.bottom
    to: [a1.bottom, a5.bottom]

  - label: "DW1000 UWB трансивер"
    from: ext.bottom
    to: [a1.bottom, a3.bottom, a4.bottom]

  - label: "MAC уровень\n(IEEE 802.15.4 стек)"
    from: ext.bottom
    to: [a2.bottom, a3.bottom, a4.bottom]

  - label: "SS-TWR стек"
    from: ext.bottom
    to: [a3.bottom, a4.bottom]

  - label: "UART драйвер"
    from: ext.bottom
    to: a5.bottom

  # ── Внутренние стрелки ───────────────────────────────────────────────────

  - label: "Инициализированная\nаппаратная среда"
    from: a1.right
    to: a2.left

  - label: "Список устройств\n(seq_id, MAC, тип)"
    from: a2.right
    to: a3.left

  - label: "Откалиброванные\nмежанкерные дистанции"
    from: a3.right
    to: a4.left

  - label: "Данные дистанций\n(meas_table rows)"
    from: a4.right
    to: a5.left
