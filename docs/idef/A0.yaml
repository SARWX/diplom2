# IDEF0 — Уровень A-0 (контекстная диаграмма, один блок)
# Описывает систему как единое целое

diagram:
  name: "UWB система позиционирования — A-0"
  node: "A-0"
  title: "Определить положение мобильного объекта"

activities:
  - id: a0
    name: "Определить\nположение\nмобильного объекта"

arrows:

  # ── Inputs ───────────────────────────────────────────────────────────────

  - label: "Питание и аппаратная\nконфигурация"
    from: ext.left
    to: a0.left

  - label: "UART команды хоста"
    from: ext.left
    to: a0.left

  # ── Outputs ──────────────────────────────────────────────────────────────

  - label: "Данные дистанций\n(бинарные пакеты meas_table)"
    from: a0.right
    to: ext.right

  - label: "Статус системы\n(OK / ERR / device list)"
    from: a0.right
    to: ext.right

  # ── Controls ─────────────────────────────────────────────────────────────

  - label: "Роль устройства\n(MAIN_ANCHOR / ANCHOR / TAG)"
    from: ext.top
    to: a0.top

  - label: "UWB протокол\n(IEEE 802.15.4 + SS-TWR)"
    from: ext.top
    to: a0.top

  - label: "Параметры калибровки\n(SET_ANT_DLY / SET_TEMP_COEF)"
    from: ext.top
    to: a0.top

  # ── Mechanisms ───────────────────────────────────────────────────────────

  - label: "STM32F103C8\n(CPU, UART, SPI, GPIO)"
    from: ext.bottom
    to: a0.bottom

  - label: "DW1000 UWB трансивер"
    from: ext.bottom
    to: a0.bottom
