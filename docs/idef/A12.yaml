# IDEF0 — Декомпозиция A2 «Обнаружение устройств»
# Внешние стрелки (ICOM) = стрелки блока A2 в A1.yaml:
#   Input:    «Инициализированная аппаратная среда»  (a1 → a2, здесь ext.left)
#   Output:   «Список устройств (seq_id, MAC, тип)»  (a2 → a3, здесь ext.right)
#   Control:  «UWB протокол (IEEE 802.15.4)»          (ext.top → a2.top)
#             «UART команды хоста» (команда INITIALIZE инициирует процесс)
#   Mechanism: «MAC уровень»                          (ext.bottom → a2.bottom)

diagram:
  name: "Обнаружение устройств — A12"
  node: "A12"
  parent: "A1"
  title: "Декомпозиция: энумерация узлов сети"

activities:

  - id: a1
    name: "Широковещательный\nзапрос DISCOVER"

  - id: a2
    name: "Сбор откликов\nузлов"

  - id: a3
    name: "Рассылка\nSYNC_LIST"

  - id: a4
    name: "Подтверждение\nрегистрации"

arrows:

  # ── Inputs (= «Инициализированная аппаратная среда» из A1) ───────────────

  - label: "Инициализированная\nаппаратная среда"
    from: ext.left
    to: a1.left

  # ── Outputs (= «Список устройств» из A1) ─────────────────────────────────

  - label: "Список устройств\n(seq_id, MAC, тип)"
    from: a4.right
    to: ext.right

  # ── Controls (= «UWB протокол», «UART команды хоста» из A1) ──────────────

  - label: "UWB протокол\n(IEEE 802.15.4)"
    from: ext.top
    to: [a1.top, a3.top]

  - label: "UART команды хоста\n(INITIALIZE запускает\nэнумерацию)"
    from: ext.top
    to: a1.top

  # ── Mechanisms (= «MAC уровень» из A1) ───────────────────────────────────

  - label: "MAC уровень\nnet_send_broadcast(CMD_DISCOVER)"
    from: ext.bottom
    to: a1.bottom

  - label: "MAC уровень\nnet_rx_poll() + кольцевой\nбуфер ISR (rx_rbuf)"
    from: ext.bottom
    to: [a2.bottom, a4.bottom]

  # ── Внутренние стрелки ────────────────────────────────────────────────────

  - label: "Ответы устройств\n(«A»/«T» + EUI-64)\nпо UWB"
    from: a1.right
    to: a2.left

  - label: "Накопленный список\nузлов (MAC, тип)"
    from: a2.right
    to: a3.left

  - label: "Сериализованный\nSYNC_LIST"
    from: a3.right
    to: a4.left

  - label: "Таймауты\n(ENUM_LISTEN_MS,\nSYNC_WAIT_MS)\nENUM_RETRY_MAX"
    from: ext.top
    to: [a2.top, a4.top]

  - label: "net_device_create()\nnet_device_add()"
    from: ext.bottom
    to: a2.bottom

  - label: "net_send_to_16bit()\n(SYNC_LIST → каждому)"
    from: ext.bottom
    to: a3.bottom
