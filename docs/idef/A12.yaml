# IDEF0 — Декомпозиция A2 «Обнаружение устройств»
# ICOM = стрелки блока a2 из A1.yaml:
#   Input:    «Инициализированная аппаратная среда»
#   Output:   «Список устройств (seq_id, MAC, тип)»
#   Control:  «UWB протокол», «UART команды хоста»
#   Mechanism: «MAC уровень»

diagram:
  name: "Обнаружение устройств — A12"
  node: "A12"
  parent: "A1"
  title: "Декомпозиция: энумерация узлов сети"

activities:

  - id: a1
    name: "Широковещательный\nзапрос DISCOVER"

  - id: a2
    name: "Сбор откликов\nузлов"

  - id: a3
    name: "Рассылка\nSYNC_LIST"

  - id: a4
    name: "Подтверждение\nрегистрации"

arrows:

  # ── Inputs ────────────────────────────────────────────────────────────────

  - label: "Инициализированная\nаппаратная среда"
    from: ext.left
    to: a1.left

  # ── Outputs ───────────────────────────────────────────────────────────────

  - label: "Список устройств\n(seq_id, MAC, тип)"
    from: a4.right
    to: ext.right

  # ── Controls ──────────────────────────────────────────────────────────────

  - label: "UWB протокол\n(IEEE 802.15.4 + SS-TWR)"
    from: ext.top
    to: [a1.top, a3.top]

  - label: "UART команды хоста"
    from: ext.top
    to: a1.top

  # ── Mechanisms ────────────────────────────────────────────────────────────

  - label: "MAC уровень\n(IEEE 802.15.4 стек)"
    from: ext.bottom
    to: [a1.bottom, a2.bottom, a3.bottom, a4.bottom]

  # ── Внутренние стрелки ────────────────────────────────────────────────────

  - label: "Ответы устройств\n(«A»/«T» + EUI-64)\nпо UWB"
    from: a1.right
    to: a2.left

  - label: "Накопленный список\nузлов (MAC, тип)"
    from: a2.right
    to: a3.left

  - label: "Сериализованный\nSYNC_LIST"
    from: a3.right
    to: a4.left
