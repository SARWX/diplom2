# IDEF0 — Декомпозиция A3 «Конфигурирование сети»
# ICOM = стрелки блока a3 из A1.yaml:
#   Input:    «Список устройств (seq_id, MAC, тип)»
#   Output:   «Откалиброванные межанкерные дистанции»
#   Control:  «UWB протокол»
#   Mechanism: «DW1000 UWB трансивер», «MAC уровень», «SS-TWR стек»

diagram:
  name: "Конфигурирование сети — A13"
  node: "A13"
  parent: "A1"
  title: "Декомпозиция: измерение межанкерных дистанций"

activities:

  - id: a1
    name: "Выбор измеряющего\nузла и рассылка\nCONFIG_START"

  - id: a2
    name: "Считывание\nтемпературы узла"

  - id: a3
    name: "Измерение дистанций\nSS-TWR ко всем якорям"

  - id: a4
    name: "Приём и сохранение\nтаблицы измерений"

arrows:

  # ── Inputs ────────────────────────────────────────────────────────────────

  - label: "Список устройств\n(seq_id, MAC, тип)"
    from: ext.left
    to: a1.left

  # ── Outputs ───────────────────────────────────────────────────────────────

  - label: "Откалиброванные\nмежанкерные дистанции"
    from: a4.right
    to: ext.right

  # ── Controls ──────────────────────────────────────────────────────────────

  - label: "UWB протокол\n(IEEE 802.15.4 + SS-TWR)"
    from: ext.top
    to: [a1.top, a3.top]

  # ── Mechanisms ────────────────────────────────────────────────────────────

  - label: "DW1000 UWB трансивер"
    from: ext.bottom
    to: a2.bottom

  - label: "MAC уровень\n(IEEE 802.15.4 стек)"
    from: ext.bottom
    to: [a1.bottom, a4.bottom]

  - label: "SS-TWR стек"
    from: ext.bottom
    to: a3.bottom

  # ── Внутренние стрелки ────────────────────────────────────────────────────

  - label: "Команда CONFIG_START\n(мастер → текущий узел)"
    from: a1.right
    to: a2.left

  - label: "Температура узла (°C)"
    from: a2.right
    to: a3.left

  - label: "Строки дистанций\n(from_id, to_id,\ndistance_mm, temp_c)"
    from: a3.right
    to: a4.left
