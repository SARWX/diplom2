# UML Component диаграмма — прошивка UWB системы позиционирования

title: "UWB Firmware — Component диаграмма"

packages:

  - id: pkg_roles
    label: "Device Roles"
    components:
      - id: main_anchor
        label: "MainAnchor"
        subcomponents:
          - id: cmd_dispatcher
            label: "Cmd\nDispatcher"
          - id: network_forwarder
            label: "Network\nForwarder"
          - id: host_io
            label: "Host\nI/O"
        internal_interfaces:
          - name: "IHostIO"
            provided_by: host_io
            required_by: cmd_dispatcher
          - name: "IForward"
            provided_by: network_forwarder
            required_by: cmd_dispatcher
      - id: anchor
        label: "Anchor"
      - id: tag
        label: "Tag"

  - id: pkg_protocols
    label: "Protocols"
    components:
      - id: enumeration
        label: "Enumeration"
      - id: configuration
        label: "Configuration"
      - id: ranging
        label: "Ranging"
      - id: meas_table
        label: "MeasTable"

  - id: pkg_ss_twr
    label: "Ranging PHY"
    components:
      - id: ss_twr
        label: "SS-TWR"
        subcomponents:
          - id: initiator
            label: "Initiator\n(main-loop)"
          - id: responder
            label: "Responder\n(ISR)"
          - id: calib_control
            label: "Calibration\nControl"
        internal_interfaces:
          - name: "ICalib"
            provided_by: calib_control
            required_by: [initiator, responder]

  - id: pkg_mac
    label: "Network"
    components:
      - id: net_mac
        label: "NetMAC"
        subcomponents:
          - id: frame_builder
            label: "Frame\nBuilder"
          - id: tx_controller
            label: "TX\nController"
          - id: rx_dispatcher
            label: "RX\nDispatcher"
        internal_interfaces:
          - name: "ITx"
            provided_by: tx_controller
            required_by: [frame_builder, rx_dispatcher]
      - id: net_devices
        label: "NetDevices"
      - id: cmd_parser
        label: "CmdParser"

  - id: pkg_platform
    label: "Platform"
    components:
      - id: dw1000
        label: "DW1000 Driver"
      - id: uart
        label: "UART Driver"
        subcomponents:
          - id: line_reader
            label: "Line\nReader"
          - id: formatter
            label: "Formatter"
          - id: debug_output
            label: "Debug\nOutput"
      - id: hal
        label: "HAL\n(SPI / GPIO / SysTick)"

dependencies:

  - from: pkg_roles
    to: pkg_protocols
    label: "<<use>>"

  - from: pkg_roles
    to: pkg_mac
    label: "<<use>>"

  - from: pkg_roles
    to: pkg_platform
    label: "<<use>>"

  - from: pkg_protocols
    to: pkg_ss_twr
    label: "<<use>>"

  - from: pkg_protocols
    to: pkg_mac
    label: "<<use>>"

  - from: pkg_ss_twr
    to: pkg_platform
    label: "<<use>>"

  - from: pkg_mac
    to: pkg_platform
    label: "<<use>>"
