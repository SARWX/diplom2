title: "UWB Firmware — Component диаграмма"
cols: 4

components:

  # ── РОЛИ УСТРОЙСТВ ──────────────────────────────────────────────────────────

  - id: main_anchor
    label: "MainAnchor"
    subcomponents:
      - id: cmd_dispatcher
        label: "CmdDispatcher"
      - id: host_io
        label: "HostIO"
      - id: net_forwarder
        label: "NetworkForwarder"
    internal_interfaces:
      - name: "IHostIO"
        provided_by: host_io
        required_by: [cmd_dispatcher]
      - name: "IForward"
        provided_by: net_forwarder
        required_by: [cmd_dispatcher]
    port_delegations:
      - {iface: "IUart",          to: host_io}
      - {iface: "INetSend",       to: net_forwarder}
      - {iface: "INetDevices",    to: net_forwarder}
      - {iface: "ICmdParser",     to: cmd_dispatcher}
      - {iface: "IEnumeration",   to: cmd_dispatcher}
      - {iface: "IConfiguration", to: cmd_dispatcher}
      - {iface: "IRanging",       to: cmd_dispatcher}
      - {iface: "ISsTwr",         to: cmd_dispatcher}
      - {iface: "IMeasTable",     to: host_io}

  - id: anchor
    label: "Anchor"

  - id: tag
    label: "Tag"

  # ── ПРОТОКОЛЫ ──────────────────────────────────────────────────────────────

  - id: enumeration
    label: "Enumeration"

  - id: configuration
    label: "Configuration"

  - id: ranging
    label: "Ranging"

  - id: meas_table
    label: "MeasTable"

  # ── ДАЛЬНОМЕТРИЯ ───────────────────────────────────────────────────────────

  - id: ss_twr
    label: "SS-TWR"
    subcomponents:
      - id: initiator
        label: "Initiator\n(main-loop)"
      - id: responder
        label: "Responder\n(ISR)"
      - id: calib_control
        label: "CalibControl"
    internal_interfaces:
      - name: "ICalib"
        provided_by: calib_control
        required_by: [initiator, responder]
    port_delegations:
      - {iface: "ISsTwr",   to: initiator}
      - {iface: "IDw1000",  to: initiator}
      - {iface: "IDw1000",  to: responder}
      - {iface: "IDw1000",  to: calib_control}
      - {iface: "INetSend", to: initiator}

  # ── СЕТЕВОЙ УРОВЕНЬ ────────────────────────────────────────────────────────

  - id: net_mac
    label: "NetMAC"
    subcomponents:
      - id: frame_builder
        label: "FrameBuilder"
      - id: tx_controller
        label: "TxController"
      - id: rx_dispatcher
        label: "RxDispatcher"
    internal_interfaces:
      - name: "ITxCtrl"
        provided_by: tx_controller
        required_by: [frame_builder, rx_dispatcher]
    port_delegations:
      - {iface: "INetSend", to: frame_builder}
      - {iface: "INetMac",  to: rx_dispatcher}
      - {iface: "IDw1000",  to: tx_controller}
      - {iface: "IDw1000",  to: rx_dispatcher}
      - {iface: "IRxBuf",   to: rx_dispatcher}

  - id: net_devices
    label: "NetDevices"

  - id: cmd_parser
    label: "CmdParser"

  # ── ПЛАТФОРМА ──────────────────────────────────────────────────────────────

  - id: uart_driver
    label: "UartDriver"
    subcomponents:
      - id: line_reader
        label: "LineReader"
      - id: formatter
        label: "Formatter"
      - id: debug_output
        label: "DebugOutput"
    internal_interfaces:
      - name: "IFormat"
        provided_by: formatter
        required_by: [debug_output]
    port_delegations:
      - {iface: "IUart", to: line_reader}
      - {iface: "IUart", to: formatter}
      - {iface: "IUart", to: debug_output}
      - {iface: "IHAL",  to: line_reader}
      - {iface: "IHAL",  to: formatter}

  - id: dw1000
    label: "DW1000 Driver"

  - id: rx_rbuf
    label: "RxRingBuf"

  - id: hal
    label: "HAL\n(SPI / GPIO / SysTick)"

dependencies:

  # ── MainAnchor → всё что использует ─────────────────────────────────────────
  - {from: main_anchor, to: uart_driver,   label: "IUart"}
  - {from: main_anchor, to: net_mac,       label: "INetSend"}
  - {from: main_anchor, to: net_devices,   label: "INetDevices"}
  - {from: main_anchor, to: cmd_parser,    label: "ICmdParser"}
  - {from: main_anchor, to: enumeration,   label: "IEnumeration"}
  - {from: main_anchor, to: configuration, label: "IConfiguration"}
  - {from: main_anchor, to: ranging,       label: "IRanging"}
  - {from: main_anchor, to: ss_twr,        label: "ISsTwr"}
  - {from: main_anchor, to: meas_table,    label: "IMeasTable"}

  # ── Anchor → всё что использует ──────────────────────────────────────────────
  - {from: anchor, to: enumeration,   label: "IEnumeration"}
  - {from: anchor, to: configuration, label: "IConfiguration"}
  - {from: anchor, to: net_mac,       label: "INetMac"}
  - {from: anchor, to: ss_twr,        label: "ISsTwr"}

  # ── Tag → всё что использует ─────────────────────────────────────────────────
  - {from: tag, to: enumeration,   label: "IEnumeration"}
  - {from: tag, to: configuration, label: "IConfiguration"}
  - {from: tag, to: ranging,       label: "IRanging"}
  - {from: tag, to: net_mac,       label: "INetMac"}
  - {from: tag, to: ss_twr,        label: "ISsTwr"}

  # ── Протоколы → зависимости ───────────────────────────────────────────────────
  - {from: enumeration,   to: net_mac,     label: "INetSend"}
  - {from: enumeration,   to: net_devices, label: "INetDevices"}
  - {from: enumeration,   to: cmd_parser,  label: "ICmdParser"}

  - {from: configuration, to: net_mac,     label: "INetSend"}
  - {from: configuration, to: net_devices, label: "INetDevices"}
  - {from: configuration, to: cmd_parser,  label: "ICmdParser"}
  - {from: configuration, to: meas_table,  label: "IMeasTable"}
  - {from: configuration, to: ss_twr,      label: "ISsTwr"}

  - {from: ranging,       to: net_mac,     label: "INetSend"}
  - {from: ranging,       to: net_devices, label: "INetDevices"}
  - {from: ranging,       to: cmd_parser,  label: "ICmdParser"}
  - {from: ranging,       to: meas_table,  label: "IMeasTable"}
  - {from: ranging,       to: ss_twr,      label: "ISsTwr"}
  - {from: ranging,       to: uart_driver, label: "IUart"}

  - {from: meas_table, to: net_devices, label: "INetDevices"}
  - {from: meas_table, to: uart_driver, label: "IUart"}

  # ── SS-TWR → зависимости ─────────────────────────────────────────────────────
  - {from: ss_twr, to: dw1000,  label: "IDw1000"}
  - {from: ss_twr, to: net_mac, label: "INetSend"}

  # ── NetMAC → зависимости ─────────────────────────────────────────────────────
  - {from: net_mac, to: dw1000,  label: "IDw1000"}
  - {from: net_mac, to: rx_rbuf, label: "IRxBuf"}

  # ── Платформа → зависимости ───────────────────────────────────────────────────
  - {from: dw1000,      to: hal, label: "IHAL"}
  - {from: uart_driver, to: hal, label: "IHAL"}
