title: "UWB Система позиционирования — прошивка STM32 + DW1000"

nodes:
  - label: "Аппаратная платформа"
    children:
      - label: "STM32F103C8 (64 КБ Flash, 20 КБ RAM)"
        children:
          - label: "SPI → DW1000, UART @ 115200 → хост, SysTick"
      - label: "UWB-трансивер DW1000"
        children:
          - label: "Канал 2, PRF 64 МГц, 6.8 Мбит/с"
          - label: "Дальнометрия SS-TWR, встроенный датчик температуры"

  - label: "Прошивка (user/)"
    children:
      - label: "Роли устройств"
        children:
          - label: "MainAnchor — мастер-якорь"
            children:
              - label: "UART readline → cmd_parse → обработчики команд"
              - label: "Энумерация + конфигурация + отправка пакетов на хост"
              - label: "Форвардинг SET_ANT_DLY / SET_TEMP_COEF на якоря по UWB"
          - label: "Anchor — якорь"
            children:
              - label: "Участие в энумерации и конфигурации"
              - label: "Приём и применение калибровочных параметров"
          - label: "Tag — мобильный тег"
            children:
              - label: "Участие в энумерации и конфигурации"
              - label: "Непрерывная дальнометрия до всех якорей → отправка на мастер"

      - label: "Библиотека (my_lib/)"
        children:
          - label: "net_mac — MAC IEEE 802.15.4: сборка кадров, TX/RX, ISR-коллбэки"
          - label: "net_devices — реестр узлов: seq_id, тип, MAC, дистанции, температура"
          - label: "cmd_parser — сопоставление текстовых команд с таблицей"
          - label: "ss_twr — SS-TWR: инициатор + ответчик (ISR), температура, калибровка"

      - label: "Протоколы (protocols/)"
        children:
          - label: "enumeration — DISCOVER → сбор откликов → SYNC_LIST → подтверждение"
          - label: "configuration — мастер обходит узлы, каждый измеряет дистанции SS-TWR и отправляет мастеру"
          - label: "ranging — тег непрерывно измеряет дистанции и стримит MeasTablePacket мастеру"
          - label: "meas_table — сериализация / десериализация MeasTablePacket (magic 0xAA 0xBB, v2)"

  - label: "UART-протокол (хост ↔ MainAnchor)"
    children:
      - label: "Рукопожатие: LOC_POS_SYS\\r\\n → LPS\\r\\n"
      - label: "Команды: INITIALIZE, RECONFIGURE, RESET, GET_STATUS, RANGING_START, STOP, SET_ANT_DLY, SET_TEMP_COEF, DEBUG_ON/OFF"
      - label: "DeviceListPacket (0xAA 0xCC) — seq_id, тип, MAC на каждый узел"
      - label: "MeasTablePacket (0xAA 0xBB) — from/to seq_id, distance_mm (int32), temperature_c (int8)"

  - label: "Алгоритмы измерения"
    children:
      - label: "SS-TWR: tof = (rtd_init - rtd_resp × (1 + clock_offset)) / 2"
      - label: "Коррекция тактовых частот: clock_offset из carrier integrator DW1000"
      - label: "Температурная коррекция: distance -= K × (T − 23 °C)"
